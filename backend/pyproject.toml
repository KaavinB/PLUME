[project]
name = "plume-backend"
version = "0.1.0"
description = "PLUME — methane incident investigation, repair escrow coordination and verification API"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "web3>=7.0",
  "eth-account>=0.13",
  "pyjwt>=2.9",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the PostGIS test database (and Foundry for chain tests)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
